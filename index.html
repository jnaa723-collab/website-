 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موقعي</title>
<style>
:root{--c1:#f7d6f3;--c2:#e6dbf7;--c3:#aab8f5;--c4:#b4def2;--dot:#4a22d6}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:
  radial-gradient(ellipse 60% 40% at 0% 55%,var(--c3),transparent 70%),
  radial-gradient(ellipse 70% 40% at 50% 100%,var(--c4),transparent 75%),
  radial-gradient(ellipse 60% 40% at 25% 5%,var(--c1),transparent 70%),
  linear-gradient(160deg,var(--c2),var(--c1) 40%,var(--c2));
  background-attachment:fixed}

/* الزخارف الثابتة */
.art{position:fixed;inset:0;z-index:0;pointer-events:none}
.dots{position:absolute;top:0;right:0;width:min(62vw,560px);height:48vh;
  background:radial-gradient(circle,var(--dot) 1.7px,transparent 2.3px) 0 0/11px 11px;
  -webkit-mask-image:radial-gradient(ellipse 95% 90% at 100% 0,#000 15%,transparent 68%);
  mask-image:radial-gradient(ellipse 95% 90% at 100% 0,#000 15%,transparent 68%)}
.star{position:absolute;filter:drop-shadow(0 6px 14px rgba(150,120,230,.45))}
.s1{top:19vh;right:5vw;width:min(24vw,170px)}
.s2{top:27vh;right:calc(5vw + min(24vw,170px) + 6px);width:min(7vw,44px)}
.bub{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85),rgba(190,170,255,.22) 42%,rgba(170,205,255,.18) 70%,rgba(255,200,240,.4));
  box-shadow:inset 0 0 16px rgba(255,255,255,.6),0 4px 14px rgba(150,130,220,.2)}
.b1{width:min(26vw,140px);height:min(26vw,140px);left:-2vw;bottom:9vh}
.b2{width:min(30vw,170px);height:min(30vw,170px);left:8vw;bottom:-3vh}
.b3{width:min(10vw,56px);height:min(10vw,56px);left:min(22vw,120px);bottom:21vh}
.b4{width:min(14vw,76px);height:min(14vw,76px);left:min(27vw,150px);bottom:26vh}
.b5{width:min(7vw,40px);height:min(7vw,40px);left:min(18vw,100px);bottom:30vh}
.b6{width:min(9vw,50px);height:min(9vw,50px);left:min(14vw,80px);bottom:16vh}

main{position:relative;z-index:1;padding:24px}
</style>
</head>
<body>
<div class="art">
  <div class="dots"></div>
  <svg class="star s1" viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d8ff"/><stop offset=".35" stop-color="#bfe3ff"/>
      <stop offset=".65" stop-color="#ffc9e6"/><stop offset="1" stop-color="#c9b6ff"/></linearGradient></defs>
    <path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z" fill="url(#g)" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>
  </svg>
  <svg class="star s2" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0Z" fill="url(#g)" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
  </svg>
  <div class="bub b1"></div><div class="bub b2"></div><div class="bub b3"></div>
  <div class="bub b4"></div><div class="bub b5"></div><div class="bub b6"></div>
</div>

<main>
  <!-- حط محتوى صفحتك هنا -->
</main>
</body>
</html>
