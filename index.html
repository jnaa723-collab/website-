<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المكتبة الكيميائية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fad4f4;--bg2:#e0d8f7;--bg3:#a9d8f0;--blob:#b9a6ff;
  --accent:#8b4dff;--accent2:#bb4fb3;--text:#7a3df0;--card:rgba(200,160,250,.38);
  --card-b:rgba(150,110,220,.35);--drawer-t:#d4e8ff;--body:#3b2b66;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1740;--bg2:#1c1a45;--bg3:#12334a;--blob:#6a3fd0;
    --accent:#a77bff;--accent2:#c25bb9;--text:#d9c6ff;--card:rgba(140,100,220,.28);
    --card-b:rgba(190,160,255,.3);--drawer-t:#e6f0ff;--body:#e8defc;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1740;--bg2:#1c1a45;--bg3:#12334a;--blob:#6a3fd0;
  --accent:#a77bff;--accent2:#c25bb9;--text:#d9c6ff;--card:rgba(140,100,220,.28);
  --card-b:rgba(190,160,255,.3);--drawer-t:#e6f0ff;--body:#e8defc;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--body);
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:300% 300%;
  animation:flow 14s ease-in-out infinite;overflow:hidden;position:relative}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;background:var(--blob);pointer-events:none;z-index:0}
.b1{width:300px;height:300px;top:-60px;right:-80px;animation:f1 16s ease-in-out infinite}
.b2{width:260px;height:260px;bottom:8%;left:-90px;background:#8fc4f0;animation:f2 19s ease-in-out infinite}
.b3{width:220px;height:220px;top:42%;right:20%;background:#f4a6e6;animation:f3 22s ease-in-out infinite}
@keyframes f1{50%{transform:translate(-90px,120px) scale(1.2)}}
@keyframes f2{50%{transform:translate(120px,-110px) scale(1.15)}}
@keyframes f3{33%{transform:translate(-60px,80px)}66%{transform:translate(70px,-60px) scale(1.25)}}
.mol{position:fixed;z-index:0;pointer-events:none;font-size:22px;opacity:.25;color:var(--accent);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}

#menuBtn{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;width:58px;height:46px;border:0;
  border-radius:0 24px 24px 0;background:linear-gradient(90deg,var(--accent2),var(--accent));cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;transition:transform .2s}
#menuBtn:active{transform:scale(.92)}
#menuBtn span{width:26px;height:3px;border-radius:2px;background:#dbe6ff;transition:.3s}
#menuBtn.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
#menuBtn.open span:nth-child(2){opacity:0}
#menuBtn.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

#drawer{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;width:min(78vw,260px);
  border-radius:0 28px 28px 0;background:linear-gradient(270deg,var(--accent),var(--accent2));
  transform:translateX(-105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding-bottom:20px;
  box-shadow:0 10px 30px rgba(90,40,160,.35)}
#drawer.open{transform:none}
#drawer h2{font-size:20px;text-align:center;padding:20px 10px 16px;color:var(--drawer-t);border-bottom:1px solid rgba(255,255,255,.3)}
#drawer a{display:block;text-align:center;font-weight:700;font-size:18px;color:var(--drawer-t);padding:16px 10px;text-decoration:none;
  transition:background .2s}
#drawer a:active,#drawer a.active{background:rgba(255,255,255,.18)}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(40,20,80,.25);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.show{opacity:1;pointer-events:auto}

main{position:relative;z-index:5;height:100%;overflow-y:auto;padding:90px 22px 40px}
.view{display:none;max-width:560px;margin:0 auto;min-height:100%}
.view.active{display:block;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
#home.active{display:flex;flex-direction:column;justify-content:center;gap:28px}
.big{display:block;width:100%;padding:28px 10px;font:700 22px 'Tajawal',sans-serif;color:var(--text);text-align:center;
  background:var(--card);border:2px solid var(--card-b);border-radius:60px;cursor:pointer;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);transition:transform .2s,box-shadow .2s,background .2s}
.big:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(140,80,240,.3)}
.big:active{transform:scale(.96)}
.back{border:0;background:none;color:var(--text);font:700 17px 'Tajawal',sans-serif;cursor:pointer;margin-bottom:14px;padding:6px 0}
.title{font-size:26px;color:var(--text);margin-bottom:18px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;margin-bottom:12px;
  background:var(--card);border:1.5px solid var(--card-b);border-radius:22px;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);font-weight:700;transition:transform .2s;cursor:pointer}
.item:active{transform:scale(.97)}
.item small{display:block;font-weight:500;opacity:.8;margin-top:3px;direction:ltr;text-align:right}
.item .tag{font-size:20px;color:var(--text)}
.detail{margin-top:10px;padding:16px;border-radius:20px;background:var(--card);border:1.5px solid var(--card-b);
  line-height:1.9;display:none}
.detail.show{display:block;animation:in .3s both}
.eq{direction:ltr;text-align:center;font-size:20px;color:var(--text);margin:6px 0 2px;font-weight:700}
.page{padding:20px;border-radius:24px;background:var(--card);border:1.5px solid var(--card-b);line-height:1.9;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#toast{position:fixed;z-index:40;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:50%;transform:translate(-50%,30px);
  background:var(--accent);color:#fff;padding:10px 20px;border-radius:30px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* الواجهة الافتتاحية */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.flask{width:150px;height:180px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.bub{animation:bub 2.4s ease-in infinite;opacity:0}
.bub:nth-of-type(2){animation-delay:.8s}.bub:nth-of-type(3){animation-delay:1.6s}
@keyframes bub{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-45px);opacity:0}}
#splash h1{font-size:36px;color:var(--text)}
#splash p{font-size:19px;opacity:.85}
#startBtn{width:min(80%,300px);margin-top:18px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 28px rgba(140,80,240,.45)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="mols"></div>

<div id="splash">
  <svg class="flask" viewBox="0 0 100 120" aria-hidden="true">
    <defs><clipPath id="fc"><path d="M38 8h24v8h-4v30l26 52a10 10 0 0 1-9 15H25a10 10 0 0 1-9-15l26-52V16h-4z"/></clipPath></defs>
    <rect x="10" y="76" width="80" height="45" clip-path="url(#fc)" fill="var(--accent)" opacity=".55"/>
    <circle class="bub" cx="45" cy="100" r="3" fill="#fff"/>
    <circle class="bub" cx="58" cy="104" r="4" fill="#fff"/>
    <circle class="bub" cx="52" cy="98" r="2.5" fill="#fff"/>
    <path d="M38 8h24v8h-4v30l26 52a10 10 0 0 1-9 15H25a10 10 0 0 1-9-15l26-52V16h-4z" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/>
  </svg>
  <h1>المكتبة الكيميائية</h1>
  <p>كلية العلوم</p>
  <button class="big" id="startBtn">ابدأ</button>
</div>

<button id="menuBtn" aria-label="القائمة"><span></span><span></span><span></span></button>
<div id="scrim"></div>
<nav id="drawer">
  <h2>كلية العلوم</h2>
  <a href="#admin">الإدارة</a>
  <a href="#content">المحتوى</a>
  <a href="#library">المكتبة الكيميائية</a>
  <a href="#home">الرئيسية</a>
</nav>

<main>
  <section id="home" class="view">
    <button class="big" data-go="emails">إيميلات الدكاترة</button>
    <button class="big" data-go="library">المكتبة الكيميائية</button>
    <button class="big" data-go="reactions">التفاعلات</button>
  </section>

  <section id="emails" class="view">
    <button class="back" data-go="home">→ رجوع</button>
    <h1 class="title">إيميلات الدكاترة</h1>
    <div id="emailList"></div>
  </section>

  <section id="library" class="view">
    <button class="back" data-go="home">→ رجوع</button>
    <h1 class="title">المكتبة الكيميائية</h1>
    <div id="libList"></div>
  </section>

  <section id="reactions" class="view">
    <button class="back" data-go="home">→ رجوع</button>
    <h1 class="title">التفاعلات</h1>
    <div id="rxList"></div>
  </section>

  <section id="admin" class="view">
    <button class="back" data-go="home">→ رجوع</button>
    <h1 class="title">الإدارة</h1>
    <div class="page">صفحة الإدارة — أضف محتواك هنا.</div>
  </section>

  <section id="content" class="view">
    <button class="back" data-go="home">→ رجوع</button>
    <h1 class="title">المحتوى</h1>
    <div class="page">صفحة المحتوى — أضف محتواك هنا.</div>
  </section>
</main>
<div id="toast"></div>

<script>
/* ===== البيانات: عدّلها هنا (أمثلة) ===== */
const DOCTORS=[
  {name:"د. اسم الدكتور 1",mail:"doctor1@example.com"},
  {name:"د. اسم الدكتور 2",mail:"doctor2@example.com"},
  {name:"د. اسم الدكتور 3",mail:"doctor3@example.com"}
];
const LIBRARY=[
  {name:"الكيمياء العضوية",info:"ملخصات وكتب المقرر."},
  {name:"الكيمياء غير العضوية",info:"ملخصات وكتب المقرر."},
  {name:"الكيمياء التحليلية",info:"ملخصات وكتب المقرر."},
  {name:"الكيمياء الفيزيائية",info:"ملخصات وكتب المقرر."}
];
const REACTIONS=[
  {name:"تفاعل التعادل",eq:"HCl + NaOH → NaCl + H₂O",info:"حمض + قاعدة ← ملح + ماء."},
  {name:"تفاعل الاحتراق",eq:"CH₄ + 2O₂ → CO₂ + 2H₂O",info:"احتراق الهيدروكربون في الأكسجين."},
  {name:"الإحلال الأحادي",eq:"Zn + CuSO₄ → ZnSO₄ + Cu",info:"عنصر أنشط يحل محل عنصر أقل نشاطًا."}
];

const $=s=>document.querySelector(s);
const views=[...document.querySelectorAll('.view')];
const names=views.map(v=>v.id);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}

/* بناء القوائم */
$('#emailList').innerHTML=DOCTORS.map(d=>`<div class="item" data-mail="${d.mail}"><div>${d.name}<small>${d.mail}</small></div><span class="tag">✉</span></div>`).join('');
$('#libList').innerHTML=LIBRARY.map((l,i)=>`<div class="item" data-toggle="l${i}"><div>${l.name}</div><span class="tag">⚗</span></div><div class="detail" id="l${i}">${l.info}</div>`).join('');
$('#rxList').innerHTML=REACTIONS.map((r,i)=>`<div class="item" data-toggle="r${i}"><div>${r.name}</div><span class="tag">⇌</span></div><div class="detail" id="r${i}"><div class="eq">${r.eq}</div>${r.info}</div>`).join('');

/* التنقل */
function show(name){
  if(!names.includes(name))name='home';
  views.forEach(v=>v.classList.toggle('active',v.id===name));
  document.querySelectorAll('#drawer a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+name));
  $('main').scrollTop=0;closeMenu();
}
function go(name){if(location.hash==='#'+name)show(name);else location.hash=name}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const t=e.target.closest('[data-toggle]');
  if(t){const d=document.getElementById(t.dataset.toggle);d.classList.toggle('show');return}
  const m=e.target.closest('[data-mail]');
  if(m){location.href='mailto:'+m.dataset.mail;
    try{navigator.clipboard.writeText(m.dataset.mail);toast('تم نسخ الإيميل')}catch(_){}}
});

/* القائمة الجانبية */
function openMenu(){$('#drawer').classList.add('open');$('#scrim').classList.add('show');$('#menuBtn').classList.add('open')}
function closeMenu(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('show');$('#menuBtn').classList.remove('open')}
$('#menuBtn').onclick=()=>$('#drawer').classList.contains('open')?closeMenu():openMenu();
$('#scrim').onclick=closeMenu;

/* رموز كيميائية عائمة في الخلفية */
const syms=['H₂O','CO₂','NaCl','O₂','⬡','C₆H₆','NH₃','H₂','⚛','HCl'];
$('#mols').innerHTML=Array.from({length:12},(_,i)=>{
  const s=syms[i%syms.length],l=Math.random()*95,d=14+Math.random()*16,dl=-Math.random()*d,sz=16+Math.random()*16;
  return `<span class="mol" style="left:${l}%;font-size:${sz}px;animation-duration:${d}s;animation-delay:${dl}s">${s}</span>`}).join('');

/* الواجهة الافتتاحية */
const sp=$('#splash');
$('#startBtn').onclick=()=>{sp.classList.add('hide');setTimeout(()=>sp.remove(),700)};
if(location.hash&&location.hash!=='#home')sp.remove();
show(location.hash.slice(1)||'home');
</script>
</body>
</html>
